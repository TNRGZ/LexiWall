{
  "name": "LexiWall - Windows icin IPA",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "bundle_identifier": {
          "description": "Application bundle identifier",
          "required": true,
          "default": "com.tnrgz.lexiwall",
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "lexiwall-ipa-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "runs-on": "macos-15",
      "timeout-minutes": 45,
      "env": {
        "LEXIWALL_BUNDLE_ID": "${{ inputs.bundle_identifier }}"
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Test, build and package unsigned IPA",
          "run": "python3 ci/build_ipa.py"
        },
        {
          "name": "IPA download",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "LexiWall-unsigned-IPA",
            "path": "build/artifacts/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Build and test diagnostics",
          "if": "always()",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "LexiWall-diagnostics",
            "path": "build/diagnostics/",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
